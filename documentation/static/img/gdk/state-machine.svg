<svg xmlns="http://www.w3.org/2000/svg" width="420" height="520" viewBox="0 0 420 520" role="img" aria-labelledby="machine-title machine-desc" style="display:block;max-width:100%;height:auto;margin:1.5rem auto">
  <title id="machine-title">The state machine execution cycle</title>
  <desc id="machine-desc">Load the session and try steps in order. Apply the first applicable step's effects, then either reload and start again or yield to the caller. If no step applies, yield directly.</desc>
  <g fill="var(--background-subtle)" stroke="var(--border-standard)" stroke-width="1.5">
    <rect x="85" y="20" width="250" height="60" rx="6"/>
    <rect x="85" y="120" width="250" height="76" rx="6"/>
    <rect x="85" y="250" width="250" height="60" rx="6"/>
    <path d="M210 340 310 385 210 430 110 385Z"/>
    <rect x="85" y="470" width="250" height="44" rx="6"/>
  </g>
  <g fill="none" stroke="var(--text-subtle)" stroke-width="1.5">
    <path d="M210 80V120"/>
    <path d="M210 196V250"/>
    <path d="M210 310V340"/>
    <path d="M210 430V470"/>
    <path d="M310 385H390V50H335"/>
    <path d="M85 158H25V492H85"/>
    <path d="M205 113 210 120 215 113 M205 243 210 250 215 243 M205 333 210 340 215 333 M205 463 210 470 215 463 M342 45 335 50 342 55 M78 487 85 492 78 497"/>
  </g>
  <g fill="currentColor" font-family="inherit" font-size="18" text-anchor="middle">
    <text x="210" y="46">Load session<tspan x="210" dy="23" font-size="16">SessionLoader</tspan></text>
    <text x="210" y="148">Try steps in order<tspan x="210" dy="24" font-size="16">Operations + inference</tspan></text>
    <text x="210" y="276">Apply returned effects<tspan x="210" dy="23" font-size="16">EffectHandler</tspan></text>
    <text x="210" y="391">Continue?</text>
    <text x="210" y="498">Return to caller</text>
  </g>
  <g fill="var(--text-subtle)" font-family="inherit" font-size="16">
    <text x="220" y="229">First applicable step</text>
    <text x="325" y="373">Yes</text>
    <text x="220" y="455">Yield</text>
    <text transform="translate(17 380) rotate(-90)">No step applies</text>
    <text transform="translate(381 286) rotate(-90)">Reload; start at the first step</text>
  </g>
</svg>
