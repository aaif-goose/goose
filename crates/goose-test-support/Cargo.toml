[package]
name = "goose-test-support"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description.workspace = true

[dependencies]
axum = { workspace = true }
env-lock = { workspace = true }
opentelemetry = { workspace = true, features = ["trace", "metrics"] }
rmcp = { workspace = true, features = ["server", "macros", "transport-streamable-http-server", "transport-io", "elicitation"] }
schemars = { workspace = true }
serde = { workspace = true }
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[[bin]]
name = "mcp_fixture_server"
path = "src/bin/mcp_fixture_server.rs"

[lints]
workspace = true

[package.metadata.cargo-machete]
# Used by the rmcp tool macros in mcp.rs
ignored = ["serde_json", "schemars"]
