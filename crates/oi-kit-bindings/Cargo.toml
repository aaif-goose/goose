[package]
name = "oi-kit-bindings"
version = "0.1.0-alpha.14"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Python and Kotlin bindings for the Open Intelligence Kit (oi-kit)"

[lib]
name = "oi_kit_bindings"
crate-type = ["cdylib", "staticlib", "rlib"]

[[bin]]
name = "oi-kit-uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["uniffi"]

[features]
default = []
uniffi = [
    "dep:uniffi",
    "dep:oi-kit-context-management",
    "dep:thiserror",
    "dep:anyhow",
    "dep:oi-kit-providers",
    "dep:futures",
    "dep:serde_json",
    "dep:tokio",
    "dep:rmcp",
    "dep:base64",
]

[dependencies]
uniffi = { version = "0.32", features = ["cli"], optional = true }
thiserror = { version = "2", optional = true }
oi-kit-providers = { version = "0.1.0-alpha.14", path = "../oi-kit-providers", features = ["rustls-tls"], optional = true }
oi-kit-context-management = { version = "0.1.0-alpha.14", path = "../oi-kit-context-management", optional = true }
futures = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
tokio = { workspace = true, features = ["rt-multi-thread", "sync"], optional = true }
anyhow = { workspace = true, optional = true }
rmcp = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
