[package]
name = "goose-context-management"
version = "0.1.0-alpha.13"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Conversation compaction for Goose"

[lints]
workspace = true

[features]
default = []
rustls-tls = []
native-tls = []

[dependencies]
goose-provider-types = { version = "0.1.0-alpha.13", path = "../goose-provider-types", default-features = false, features = ["formats", "mcp-interop", "std"] }
anyhow = { workspace = true, features = ["std"] }
async-trait = { workspace = true }
include_dir = { workspace = true }
minijinja = { version = "2.18", default-features = false, features = ["loader", "multi_template", "serde"] }
serde = { workspace = true, features = ["std"] }
serde_json = { workspace = true, features = ["preserve_order", "std"] }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
