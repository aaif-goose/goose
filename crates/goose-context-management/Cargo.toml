[package]
name = "goose-context-management"
version = "0.1.0-alpha.8"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Conversation compaction for Goose"

[lints]
workspace = true

[features]
default = []
rustls-tls = ["goose-providers/rustls-tls"]
native-tls = ["goose-providers/native-tls"]

[dependencies]
goose-providers = { version = "0.1.0-alpha.8", path = "../goose-providers", default-features = false }
anyhow = { workspace = true }
async-trait = { workspace = true }
include_dir = { workspace = true }
minijinja = { version = "2.18", default-features = false, features = ["loader", "multi_template", "serde"] }
rmcp = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["preserve_order"] }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
