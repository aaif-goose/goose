[package]
name = "goose-local-inference"
version = "0.1.0-alpha.9"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description.workspace = true

[lints]
workspace = true

[features]
default = []
cuda = ["llama-cpp-2/cuda"]
vulkan = ["llama-cpp-2/vulkan"]
mlx = [
    "dep:eredu",
    "dep:eredu-core",
    "dep:eredu-backend-mlx",
    "dep:eredu-architectures",
    "dep:eredu-text",
    "dep:image",
]
hf-hub = [
    "dep:futures",
    "dep:goose-download-manager",
    "dep:goose-sdk-types",
    "dep:hf-hub",
]

[dependencies]
anyhow = { workspace = true }
async-stream = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
etcetera = { workspace = true }
encoding_rs = { version = "0.8.35", default-features = false }
futures = { workspace = true, optional = true }
goose-download-manager = { version = "0.1.0-alpha.9", path = "../goose-download-manager", optional = true }
goose-provider-types = { version = "0.1.0-alpha.9", path = "../goose-provider-types", default-features = false }
goose-sdk-types = { version = "0.1.0-alpha.9", path = "../goose-sdk-types", default-features = false, optional = true }
hf-hub = { version = "1.0.0", default-features = false, optional = true }
include_dir = { workspace = true }
llama-cpp-2 = { workspace = true }
llama-cpp-sys-2 = { workspace = true }
minijinja = { version = "2.18", default-features = false, features = ["loader", "multi_template", "serde"] }
pulldown-cmark = { version = "0.13.4", default-features = false }
regex = { workspace = true }
rmcp = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["fs", "rt-multi-thread", "sync", "time"] }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4", "std"] }

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
eredu = { git = "https://github.com/jbg/eredu", rev = "a45e4cc4bf0e055a45156501ba4f71e787a94cb6", version = "0.5.0", default-features = false, features = ["mlx", "metal", "image"], optional = true }
eredu-architectures = { git = "https://github.com/jbg/eredu", rev = "a45e4cc4bf0e055a45156501ba4f71e787a94cb6", version = "0.5.0", default-features = false, optional = true }
eredu-backend-mlx = { git = "https://github.com/jbg/eredu", rev = "a45e4cc4bf0e055a45156501ba4f71e787a94cb6", version = "0.5.0", default-features = false, optional = true }
eredu-core = { git = "https://github.com/jbg/eredu", rev = "a45e4cc4bf0e055a45156501ba4f71e787a94cb6", version = "0.5.0", default-features = false, optional = true }
eredu-text = { git = "https://github.com/jbg/eredu", rev = "a45e4cc4bf0e055a45156501ba4f71e787a94cb6", version = "0.1.1", default-features = false, optional = true }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"], optional = true }
[target.'cfg(target_os = "macos")'.dependencies]
llama-cpp-2 = { workspace = true, features = ["sampler", "metal", "mtmd"] }

[dev-dependencies]
env-lock.workspace = true
