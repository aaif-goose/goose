name: Maven oi-kit

on:
  workflow_call:
    inputs:
      publish:
        description: "Publish oi-kit to Maven Central after building"
        required: false
        default: false
        type: boolean
      smoke-test:
        description: "Run the Kotlin oi-kit smoke test"
        required: false
        default: true
        type: boolean
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish oi-kit to Maven Central after building"
        required: true
        default: false
        type: boolean
      smoke-test:
        description: "Run the Kotlin oi-kit smoke test"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  build-native:
    name: Build native library (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container || null }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: darwin-aarch64
            os: macos-15
            resource-prefix: darwin-aarch64
          - name: linux-x86-64
            os: ubuntu-latest
            container: quay.io/pypa/manylinux_2_28_x86_64@sha256:441c35fdc6ee809ff9260894f8468ab4fea8c15dc880f8700a3f81b7922c1cda
            resource-prefix: linux-x86-64
          - name: linux-aarch64
            os: ubuntu-22.04-arm
            container: quay.io/pypa/manylinux_2_28_aarch64@sha256:8b5f2b4e8c072ae5aefeb659f22c03e1ff46e6a82f154b6c904b106c87e65ff7
            resource-prefix: linux-aarch64
          - name: win32-x86-64
            os: windows-latest
            resource-prefix: win32-x86-64

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2

      - name: Build native library
        shell: bash
        run: cargo build -p oi-kit-bindings --features uniffi --release

      - name: Stage native library
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Linux) lib="target/release/liboi_kit_bindings.so" ;;
            macOS) lib="target/release/liboi_kit_bindings.dylib" ;;
            Windows) lib="target/release/oi_kit_bindings.dll" ;;
            *) echo "unsupported runner OS: ${{ runner.os }}" >&2; exit 1 ;;
          esac
          mkdir -p "maven-native/${{ matrix.resource-prefix }}"
          cp "$lib" "maven-native/${{ matrix.resource-prefix }}/"

      - name: Upload native library artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: oi-kit-native-${{ matrix.name }}
          path: maven-native/**
          if-no-files-found: error

  package:
    name: Package Maven artifact
    needs: build-native
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1

      - name: Set up Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Download native library artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: oi-kit-native-*
          path: native-artifacts
          merge-multiple: true

      - name: Generate Kotlin bindings
        shell: bash
        run: |
          cargo build -p oi-kit-bindings --features uniffi --release
          crates/oi-kit-bindings/scripts/prepare-maven-package.sh \
            target/release/liboi_kit_bindings.so \
            linux-x86-64

      - name: Restore downloaded native libraries
        shell: bash
        run: cp -R native-artifacts/* crates/oi-kit-bindings/maven/src/main/resources/

      - name: Build Maven publication
        working-directory: crates/oi-kit-bindings/maven
        run: gradle --no-daemon publishToMavenLocal

      - name: Resolve Maven version
        id: version
        shell: bash
        run: |
          version=$(grep -m1 '^version =' crates/oi-kit-bindings/Cargo.toml | sed -E 's/version = "([^"]+)"/\1/')
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Stage Maven local artifacts
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          mkdir -p maven-artifacts
          cp -R "$HOME/.m2/repository/org/oi-kit/oi-kit/$VERSION" maven-artifacts/

      - name: Upload Maven artifact bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: oi-kit-maven
          path: maven-artifacts/**
          if-no-files-found: error

  smoke-test-linux-aarch64:
    name: Smoke test Kotlin oi-kit (linux-aarch64)
    needs: package
    if: inputs.smoke-test
    runs-on: ubuntu-22.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Download Maven artifact bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: oi-kit-maven
          path: maven-artifacts

      - name: Install Maven artifact bundle into local repository
        shell: bash
        run: |
          version=$(grep -m1 '^version =' crates/oi-kit-bindings/Cargo.toml | sed -E 's/version = "([^"]+)"/\1/')
          target="$HOME/.m2/repository/org/oi-kit/oi-kit/$version"
          mkdir -p "$target"
          find maven-artifacts -type f -exec cp -t "$target" {} +

      - name: Load native library in an ARM64 JVM
        shell: bash
        working-directory: crates/oi-kit-bindings/examples/uniffi/kotlin
        run: |
          gradle --no-daemon installDist
          cat > "$RUNNER_TEMP/LoadNativeLibrary.java" <<'JAVA'
          public class LoadNativeLibrary {
              public static void main(String[] args) {
                  System.out.println(org.oi_kit.Oi_kitKt.openaiDefaultModel());
              }
          }
          JAVA
          java -cp "$(find build/install -name '*.jar' | paste -sd: -)" "$RUNNER_TEMP/LoadNativeLibrary.java"

  publish:
    name: Publish to Maven Central
    needs: [package, smoke-test-linux-aarch64]
    runs-on: ubuntu-latest
    if: inputs.publish && !cancelled() && needs.package.result == 'success' && (!inputs.smoke-test || needs.smoke-test-linux-aarch64.result == 'success')
    environment: maven-central
    concurrency:
      group: oi-kit-maven-release-${{ needs.package.outputs.version }}
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1

      - name: Set up Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Download native library artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: oi-kit-native-*
          path: native-artifacts
          merge-multiple: true

      - name: Generate Kotlin bindings
        shell: bash
        run: |
          cargo build -p oi-kit-bindings --features uniffi --release
          crates/oi-kit-bindings/scripts/prepare-maven-package.sh \
            target/release/liboi_kit_bindings.so \
            linux-x86-64

      - name: Restore downloaded native libraries
        shell: bash
        run: cp -R native-artifacts/* crates/oi-kit-bindings/maven/src/main/resources/

      - name: Publish to Maven Central
        working-directory: crates/oi-kit-bindings/maven
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_TOKEN_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_TOKEN_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.MAVEN_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.MAVEN_SIGNING_PASSWORD }}
        run: gradle --no-daemon publishAndReleaseToMavenCentral
