name: Prepare oi-kit release

on:
  push:
    branches:
      - main
      - gdk-release-plz # Temporary: remove after validating this workflow
    paths:
      # BEGIN oi-kit CRATE PATHS
      - "crates/oi-kit-provider-types/**"
      - "crates/goose-acp-types/**"
      - "crates/oi-kit-download-manager/**"
      - "crates/oi-kit-local-inference/**"
      - "crates/oi-kit-providers/**"
      - "crates/oi-kit-agent/**"
      - "crates/oi-kit-context-management/**"
      - "crates/oi-kit-bindings/**"
      # END oi-kit CRATE PATHS
      - "release-plz.toml"
      - "Cargo.lock"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oi-kit-release-pr
  cancel-in-progress: false

jobs:
  release-pr:
    name: Create or update oi-kit release PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Activate Hermit
        uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # v1

      - name: Create or update release PR
        id: release-plz
        uses: release-plz/action@503fe65046e8810d4844f6b3aa12ab599a3549d7 # v0.5.134
        with:
          command: release-pr
          config: release-plz.toml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Synchronize oi-kit release artifacts
        if: steps.release-plz.outputs.prs_created == 'true'
        env:
          RELEASE_PR: ${{ steps.release-plz.outputs.pr }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          branch=$(jq -r '.head_branch' <<< "$RELEASE_PR")
          git fetch origin "$branch"
          git switch "$branch"
          just --justfile crates/oi-kit-bindings/justfile sync-release-artifacts
          if git diff --quiet; then
            exit 0
          fi
          git add \
            crates/oi-kit-bindings/python/pyproject.toml \
            documentation/src/data/gdk-api.json
          git commit -m "chore: synchronize oi-kit release artifacts"
          git push origin HEAD:"$branch"

      - name: Validate package versions
        if: steps.release-plz.outputs.prs_created == 'true'
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r \
            '.packages[] | select(.name == "oi-kit-bindings") | .version')
          just --justfile crates/oi-kit-bindings/justfile check-version "$version"
