\* PR 2 head (search_tools): the discovery operation adds search_tools and
\* load_tools, and the skills operation adds load_skill. With both
\* extensions on, a request starts at 5 tools, so 2 of the 3 deferred tools fit.
CONSTANTS
    Limit = 7
    OpTools = {6, 7, 8}
SPECIFICATION Spec
CONSTRAINT Bounded
INVARIANTS
    EveryRequestFits
    NoLoadPushesPastLimit
    LoadsOnlyAppend
    LoadedToolsAreSent
    UnsentToolsNeverRun
    LoadsAreDistinct
