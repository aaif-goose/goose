packages:
  - 'goose-acp-client'
  - 'goose-acp'
  - 'desktop'
  - 'goose-binary/*'

registry: https://registry.npmjs.org/
preferOffline: true
nodeLinker: hoisted
supportedArchitectures:
  os: [current, linux, darwin, win32]
  cpu: [current, x64, arm64]
overrides:
  react: ^19.2.8
  react-dom: ^19.2.8
  # Security fixes for old copies pulled in indirectly (#13781). Remove a line
  # once `pnpm why <pkg>` shows no version below its range.
  # Held back by cosmiconfig@7 (via react-select → babel-plugin-macros).
  'yaml@>=1.0.0 <1.10.3': 1.10.3
  # Held back by minimatch@3 (electron-builder, electron-forge, eslint-plugin-react).
  'brace-expansion@<1.1.22': 1.1.22
  # Held back by minimatch@5 and minimatch@9.
  'brace-expansion@>=2.0.0 <2.1.8': 2.1.8
  # Held back by @hey-api/json-schema-ref-parser, which pins js-yaml 4.2.0.
  'js-yaml@>=4.0.0 <4.3.2': 4.3.2
  # Pulled in by knip.
  'picomatch@>=4.0.0 <4.0.4': 4.0.7
allowBuilds:
  '@modelcontextprotocol/ext-apps': true
  electron: true
  electron-winstaller: true
  esbuild: true
# Electron Forge resolves @electron/node-gyp from git.
blockExoticSubdeps: false
